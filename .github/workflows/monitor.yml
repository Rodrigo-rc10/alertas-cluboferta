name: Monitor ClubOferta Reacondicionados

on:
  schedule:
    - cron: "*/5 * * * *"    # cada 5 minutos (lo mínimo que permite GitHub)
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: monitor-cluboferta
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Revisar página
        run: python monitor.py --cada 60 --durante 270   # revisa cada 1 minuto durante 4,5 minutos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar productos vistos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos_vistos.json
          git diff --staged --quiet || (git commit -m "Actualizar productos vistos" && git push)
